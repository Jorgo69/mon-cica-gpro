# =============================================================================
# CICA-GPRO — Docker Compose pour clients Docker Hub
# =============================================================================
#
# Ce fichier utilise l'image pre-construite depuis Docker Hub.
# Pas besoin de git clone, npm, ni Dockerfile.
#
# Installation :
#   1. Telecharger ce fichier + .env.docker.mysql + docker/nginx/default.conf
#   2. Adapter .env.docker.mysql (mode, ports, mots de passe)
#   3. docker compose -f docker-compose.hub.yml up -d
#
# Mise a jour :
#   docker compose -f docker-compose.hub.yml pull
#   docker compose -f docker-compose.hub.yml up -d
#   docker compose -f docker-compose.hub.yml exec app php artisan migrate --force
#
# =============================================================================

services:

  # --- Application ---
  app:
    image: jorgo69/cica-gpro:latest
    container_name: gpro-app
    restart: unless-stopped
    environment:
      # === ADAPTEZ CES VALEURS ===
      GPRO_MODE: selfhosted        # selfhosted ou saas
      APP_URL: "http://localhost:8090"
      APP_ENV: production
      APP_DEBUG: "false"
      # Base de donnees
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cica_gpro
      DB_USERNAME: gpro
      DB_PASSWORD: gpro_secret_2026
      # Redis
      REDIS_HOST: redis
      REDIS_PASSWORD: gpro_redis_2026
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_DRIVER: log
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - gpro

  # --- Nginx ---
  nginx:
    image: nginx:alpine
    container_name: gpro-nginx
    restart: unless-stopped
    ports:
      - "8090:80"                   # Changez 8090 si le port est occupe
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gpro
    depends_on:
      - app

  # --- MySQL ---
  mysql:
    image: mysql:8.0
    container_name: gpro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_2026    # CHANGEZ EN PRODUCTION
      MYSQL_DATABASE: cica_gpro
      MYSQL_USER: gpro
      MYSQL_PASSWORD: gpro_secret_2026         # CHANGEZ EN PRODUCTION
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"                 # Changez 3307 si le port est occupe
    networks:
      - gpro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_2026"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  # --- phpMyAdmin ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gpro-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"                   # Changez 8081 si le port est occupe
    networks:
      - gpro
    depends_on:
      mysql:
        condition: service_healthy

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: gpro-redis
    restart: unless-stopped
    command: redis-server --requirepass gpro_redis_2026
    volumes:
      - redis-data:/data
    networks:
      - gpro

  # --- Queue Worker ---
  queue:
    image: jorgo69/cica-gpro:latest
    container_name: gpro-queue
    restart: unless-stopped
    entrypoint: []
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cica_gpro
      DB_USERNAME: gpro
      DB_PASSWORD: gpro_secret_2026
      REDIS_HOST: redis
      REDIS_PASSWORD: gpro_redis_2026
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    networks:
      - gpro
    depends_on:
      - app

  # --- Scheduler ---
  scheduler:
    image: jorgo69/cica-gpro:latest
    container_name: gpro-scheduler
    restart: unless-stopped
    entrypoint: []
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cica_gpro
      DB_USERNAME: gpro
      DB_PASSWORD: gpro_secret_2026
      REDIS_HOST: redis
      REDIS_PASSWORD: gpro_redis_2026
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    networks:
      - gpro
    depends_on:
      - app

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local

networks:
  gpro:
    driver: bridge
