###############################################################################
# CICA-GPRO — Override PostgreSQL + pgAdmin
#
# Usage:
#   docker compose --env-file .env.docker.postgres -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
###############################################################################

services:

  # Desactiver MySQL et phpMyAdmin
  mysql:
    profiles: ["disabled"]
  phpmyadmin:
    profiles: ["disabled"]

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gpro-postgres
    restart: unless-stopped
    # Port interne Docker seulement (pgAdmin y accede via le reseau)
    # ports:
    #   - "5433:5432"
    environment:
      POSTGRES_DB: cica_gpro
      POSTGRES_USER: gpro
      POSTGRES_PASSWORD: gpro_secret_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpro -d cica_gpro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gpro

  # ── pgAdmin ────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gpro-pgadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cica-gpro.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_2026
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      - postgres
    networks:
      - gpro

  # Override app : pointer vers postgres
  app:
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cica_gpro
      DB_USERNAME: gpro
      DB_PASSWORD: gpro_secret_2026
      REDIS_HOST: redis
      REDIS_PASSWORD: gpro_redis_2026
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8090"
      GPRO_MODE: selfhosted
      BROADCAST_DRIVER: log

  # Override queue
  queue:
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cica_gpro
      DB_USERNAME: gpro
      DB_PASSWORD: gpro_secret_2026
      REDIS_HOST: redis
      REDIS_PASSWORD: gpro_redis_2026
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

  # Override scheduler
  scheduler:
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cica_gpro
      DB_USERNAME: gpro
      DB_PASSWORD: gpro_secret_2026
      REDIS_HOST: redis
      REDIS_PASSWORD: gpro_redis_2026
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

volumes:
  postgres_data:
    driver: local
