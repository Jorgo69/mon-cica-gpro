###############################################################################
# CICA-GPRO — Docker Compose (MySQL par defaut)
#
# Usage:
#   cp .env.docker .env
#   docker compose up -d --build
#
# Pour PostgreSQL:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
###############################################################################

services:

  # ── Application (PHP-FPM) ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gpro-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage/app
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-gpro.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gpro

  # ── Nginx (Reverse Proxy) ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: gpro-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - gpro

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gpro-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret_2026}"
      MYSQL_DATABASE: "${DB_DATABASE:-cica_gpro}"
      MYSQL_USER: "${DB_USERNAME:-gpro}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-gpro_secret_2026}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gpro

  # ── phpMyAdmin ─────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gpro-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret_2026}"
    depends_on:
      - mysql
    networks:
      - gpro

  # ── Redis (Cache + Queue) ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gpro-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:-gpro_redis_2026}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-gpro_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gpro

  # ── Queue Worker ───────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gpro-queue
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      - app
      - redis
    networks:
      - gpro

  # ── Scheduler (Cron) ──────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gpro-scheduler
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      - app
    networks:
      - gpro

  # ── Reverb (WebSockets — optionnel, decommentez pour activer) ──────────────
  # reverb:
  #   build:
  #     context: .
  #     dockerfile: docker/php/Dockerfile
  #   container_name: gpro-reverb
  #   restart: unless-stopped
  #   env_file: .env
  #   command: php artisan reverb:start --host=0.0.0.0 --port=8080
  #   ports:
  #     - "${REVERB_PORT:-6001}:8080"
  #   depends_on:
  #     - app
  #   networks:
  #     - gpro

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  gpro:
    driver: bridge
