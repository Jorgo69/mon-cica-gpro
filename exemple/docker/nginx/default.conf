# =============================================================================
# Configuration Nginx pour CICA-ARCHIVES (Laravel)
# =============================================================================
# Nginx agit comme un reverse proxy devant PHP-FPM.
# Il sert les fichiers statiques directement et transmet les requêtes PHP
# au conteneur PHP-FPM via le protocole FastCGI.
# =============================================================================

server {
    # -------------------------------------------------------------------------
    # Port d'écoute : 80 (HTTP)
    # Le mapping de port dans docker-compose (8080:80) rend le site
    # accessible sur http://localhost:8080
    # -------------------------------------------------------------------------
    listen 80;
    server_name localhost;

    # -------------------------------------------------------------------------
    # Racine du site : le dossier public/ de Laravel
    # C'est le seul dossier qui doit être accessible depuis le web.
    # Tous les autres dossiers (app/, config/, etc.) restent protégés.
    # -------------------------------------------------------------------------
    root /var/www/html/public;

    # -------------------------------------------------------------------------
    # Index : le point d'entrée de Laravel
    # Toutes les requêtes passent par index.php qui charge le framework
    # -------------------------------------------------------------------------
    index index.php;

    # -------------------------------------------------------------------------
    # Charset UTF-8 pour supporter les caractères français (accents, etc.)
    # -------------------------------------------------------------------------
    charset utf-8;

    # -------------------------------------------------------------------------
    # Taille max des requêtes (uploads de fichiers)
    # Doit correspondre à la config PHP (upload_max_filesize)
    # -------------------------------------------------------------------------
    client_max_body_size 64M;

    # -------------------------------------------------------------------------
    # Route principale : gestion des URLs
    # try_files essaie dans l'ordre :
    #   1. $uri       → Le fichier existe-t-il ? (ex: /css/app.css)
    #   2. $uri/      → Le dossier existe-t-il ?
    #   3. /index.php → Sinon, envoyer à Laravel (routing PHP)
    # C'est ce qui permet les "jolies URLs" de Laravel (ex: /dashboard)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # Traitement des fichiers PHP via PHP-FPM
    # Quand Nginx reçoit une requête pour un fichier .php, il la transmet
    # au conteneur PHP-FPM (service "app") sur le port 9000
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        # Sécurité : ne traiter que les fichiers PHP qui existent réellement
        try_files $uri =404;

        # Découper l'URI pour FastCGI (sépare le script du PATH_INFO)
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Envoyer la requête au service PHP-FPM
        # "app" est le nom du service dans docker-compose.yml
        # Docker résout automatiquement ce nom vers l'IP du conteneur
        fastcgi_pass app:9000;

        # Fichier index par défaut pour FastCGI
        fastcgi_index index.php;

        # Inclure les paramètres FastCGI standards
        include fastcgi_params;

        # Chemin complet du script PHP à exécuter
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeouts pour les requêtes longues (migrations, imports, etc.)
        fastcgi_read_timeout 120;
    }

    # -------------------------------------------------------------------------
    # Cache des fichiers statiques (CSS, JS, images, polices)
    # Le navigateur garde ces fichiers en cache pendant 1 mois,
    # ce qui accélère le chargement des pages suivantes
    # -------------------------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # -------------------------------------------------------------------------
    # Bloquer l'accès aux fichiers cachés (.env, .git, .htaccess, etc.)
    # Ces fichiers contiennent des informations sensibles (mots de passe, clés)
    # -------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # -------------------------------------------------------------------------
    # Pages d'erreur personnalisées
    # -------------------------------------------------------------------------
    error_page 404 /index.php;

    # -------------------------------------------------------------------------
    # Désactiver les logs pour favicon.ico et robots.txt
    # Évite de polluer les logs avec des requêtes sans intérêt
    # -------------------------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
