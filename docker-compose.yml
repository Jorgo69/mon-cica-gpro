# =============================================================================
# CICA-GPRO — Docker Compose (MySQL par defaut)
# =============================================================================
#
# IMPORTANT : ne JAMAIS copier un .env.docker vers .env !
# Utiliser --env-file pour passer les variables Docker :
#
# MySQL :
#   docker compose --env-file .env.docker.mysql up -d --build
#
# PostgreSQL :
#   docker compose --env-file .env.docker.postgres -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#
# =============================================================================

services:

  # --- Application (PHP-FPM) ---
  # Pour utiliser l'image Docker Hub au lieu de builder localement :
  #   image: cavetech/cica-gpro:latest
  # et commenter le bloc build ci-dessous.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # image: cavetech/cica-gpro:latest
    container_name: gpro-app
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cica_gpro
      DB_USERNAME: gpro
      DB_PASSWORD: gpro_secret_2026
      REDIS_HOST: redis
      REDIS_PASSWORD: gpro_redis_2026
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8090"
      GPRO_MODE: selfhosted
      BROADCAST_DRIVER: log
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - gpro

  # --- Nginx ---
  nginx:
    image: nginx:alpine
    container_name: gpro-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
    networks:
      - gpro
    depends_on:
      - app

  # --- MySQL ---
  mysql:
    image: mysql:8.0
    container_name: gpro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_2026
      MYSQL_DATABASE: cica_gpro
      MYSQL_USER: gpro
      MYSQL_PASSWORD: gpro_secret_2026
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - gpro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_2026"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  # --- phpMyAdmin ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gpro-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    networks:
      - gpro
    depends_on:
      mysql:
        condition: service_healthy

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: gpro-redis
    restart: unless-stopped
    command: redis-server --requirepass gpro_redis_2026
    volumes:
      - redis-data:/data
    networks:
      - gpro

  # --- Queue Worker ---
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpro-queue
    restart: unless-stopped
    entrypoint: []
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cica_gpro
      DB_USERNAME: gpro
      DB_PASSWORD: gpro_secret_2026
      REDIS_HOST: redis
      REDIS_PASSWORD: gpro_redis_2026
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    networks:
      - gpro
    depends_on:
      - app

  # --- Scheduler ---
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpro-scheduler
    restart: unless-stopped
    entrypoint: []
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cica_gpro
      DB_USERNAME: gpro
      DB_PASSWORD: gpro_secret_2026
      REDIS_HOST: redis
      REDIS_PASSWORD: gpro_redis_2026
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    networks:
      - gpro
    depends_on:
      - app

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local

networks:
  gpro:
    driver: bridge
